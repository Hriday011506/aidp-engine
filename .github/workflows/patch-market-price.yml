name: Optimize market price lookup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-market-price:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          new_function = '''def live_market_price(product, city):
              """Fetch a fast live India market reference from multiple retailer sources."""
              key = str(st.secrets.get("SERPAPI_KEY", "")).strip()
              if not key:
                  return None, "SERPAPI_KEY is missing from Streamlit Secrets."

              # One lightweight shopping request instead of the old Google + retry chain.
              # Google Shopping returns merchant/source names such as retailer marketplaces
              # when they are available, so the app is not tied to a single store.
              params = {
                  "engine": "google_shopping_light",
                  "q": f"{product} price {city} India Zepto Blinkit BigBasket JioMart Amazon Flipkart",
                  "location": f"{city}, India",
                  "hl": "en",
                  "gl": "in",
                  "device": "desktop",
                  "api_key": key,
                  "json_restrictor": "shopping_results.title,shopping_results.source,shopping_results.price,shopping_results.extracted_price",
              }

              try:
                  r = requests.get("https://serpapi.com/search.json", params=params, timeout=(4, 8))
                  r.raise_for_status()
                  data = r.json()
                  if data.get("error"):
                      return None, f"Live market lookup failed: {data['error']}"

                  results = list(data.get("shopping_results") or [])
                  results += list(data.get("inline_shopping_results") or [])
                  if not results:
                      return None, f"No live retailer price found for {product} in {city}."

                  # Keep prices that look like real Indian retail prices and prefer
                  # results whose title actually contains the requested product words.
                  product_words = [w.lower() for w in re.findall(r"[a-z0-9]+", product) if len(w) > 2]
                  candidates = []
                  for item in results[:40]:
                      title = str(item.get("title", ""))
                      source = str(item.get("source", "Retailer"))
                      raw_price = item.get("extracted_price")
                      if raw_price is None:
                          raw_price = item.get("price")
                      try:
                          number = float(str(raw_price).replace("₹", "").replace("Rs.", "").replace("Rs", "").replace(",", "").strip())
                      except (TypeError, ValueError):
                          continue
                      if not (0 < number < 100000):
                          continue
                      title_l = title.lower()
                      relevance = sum(1 for word in product_words if word in title_l)
                      if product_words and relevance == 0:
                          continue
                      candidates.append((number, source, title, relevance))

                  if not candidates:
                      return None, f"No usable live retailer price found for {product} in {city}."

                  # Prefer the most relevant product matches, then use the median to
                  # reduce the effect of one unusually high/low retailer listing.
                  best_relevance = max(x[3] for x in candidates)
                  candidates = [x for x in candidates if x[3] == best_relevance]
                  values = [x[0] for x in candidates]
                  price = round(float(np.median(values)), 2)
                  sources = []
                  for _, source, _, _ in candidates:
                      if source and source not in sources:
                          sources.append(source)
                  source_text = ", ".join(sources[:5]) or "retailer shopping results"
                  return price, f"Live retailer reference · {source_text}"

              except requests.exceptions.Timeout:
                  return None, "Live market lookup timed out. Please try again."
              except requests.exceptions.RequestException as exc:
                  return None, f"Live market lookup failed: {exc}"
              except (ValueError, TypeError) as exc:
                  return None, f"Live market data could not be read: {exc}"


'''

          pattern = r"def live_market_price\(product, city\):.*?\n\ndef holiday_days\(year, month\):"
          replacement = new_function + "def holiday_days(year, month):"
          patched, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not find the existing live_market_price function; no changes made.')
          path.write_text(patched, encoding='utf-8')
          print('Patched live_market_price in app.py')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Use fast multi-retailer market lookup"
          git push
